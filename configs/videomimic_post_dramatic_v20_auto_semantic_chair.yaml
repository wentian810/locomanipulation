# V20: consume the fixed-camera V8 package, infer an inspectable chair solely
# from its aligned seat support and seated-SMPL evidence, then render V9 GMR.
input:
  dataset_dir: /home/jixingyu/data/animation
  clip_filter: Ways_to_Jump_+_Sit_+_Fall_Dramatic_clip1
  min_duration_seconds: 0
  max_videos: 1

output:
  root: output_dir/videomimic_post_dramatic_v20_auto_semantic_chair

runtime:
  cuda_visible_devices: "4"

phc:
  enabled: false

gmr:
  enabled: true
  hand_model: sharpa
  source: final
  height_adjust_mode: global_foot_geom
  support_apply_root_z: false
  camera_subject_align_xy: false
  scene_mujoco_name: scene_reconstruction_v20_auto_semantic_chair/scene/scene_mujoco_semantic_chair.xml
  render: true
  composite_2x2: false
  robot: unitree_g1
  mujoco_gl: egl

scene:
  enabled: true
  required: true
  backend: videomimic_nksr
  source_motion: smoothed
  output_subdir: scene_reconstruction_v20_auto_semantic_chair
  source_package_subdir: scene_reconstruction_videomimic_v8
  camera:
    mode: fixed
    source: gvhmr
    validate_static: true
    freeze_method: robust_median
    retain_raw_trajectory: true
    canonicalization: static_optimized
  # Required by the shared scene preflight; no new VideoMimic run is invoked.
  videomimic:
    root: external/VideoMimic/real2sim
    recon_env: vm1recon
    human_env: vm1rs
    gender: auto
    human_mask_mode: sam2
    max_frames: 0
    frame_stride: 1
    meshification_method: nksr
    stage4:
      enabled: false
  semantic_chair:
    enabled: true
    layout_mode: auto_seated_body
    source_package_subdir: scene_reconstruction_videomimic_v8
    level_seat: true
    phc_backrest_collision: false
  robot_bridge:
    enabled: true
    source_output_root: output_dir/videomimic_source_batch_v8
    source_scene_subdir: scene_reconstruction_videomimic_v8
    motion_name: human_motion_static_hard.npz
    camera_name: gvhmr_camera_static_hard.npz
  isaac:
    enabled: false
  physics:
    enabled: false
  runtime:
    gpu: 4
    max_parallel_clips: 1
    timeout_seconds: 21600

resume:
  skip_existing: false
  force_phc: false
  force_gmr: true
