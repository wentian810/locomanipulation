schema_version: 1

# Relative paths are resolved against this YAML file.
project_root: ..

input:
  dataset_dir: dataset_new6
  extensions: [".mp4", ".avi", ".mov", ".mkv", ".m4v"]
  clip_filter: ""
  min_duration_seconds: 8.0    # before cap; keep only sufficiently long motion clips
  max_videos: null             # after duration/sort/filter; null means no cap
  # Admission gate before GVHMR/Hand4Whole++/PHC/GMR.  YOLO-Pose checks
  # temporal evidence for head, both wrists and both ankles, rather than
  # trusting a person bounding box that may be cropped at the frame edge.
  fullbody_preflight:
    enabled: true
    mode: gate                  # gate | report; report records but admits all
    model: models/yolo11n-pose.pt
    device: auto
    samples: 32
    image_size: 640
    cache: true
    person_confidence: 0.25
    keypoint_confidence: 0.35
    min_person_ratio: 0.80
    min_person_height_ratio: 0.40
    min_usable_scale_ratio: 0.60
    min_top_ratio: 0.60
    min_left_wrist_ratio: 0.30
    min_right_wrist_ratio: 0.30
    min_left_ankle_ratio: 0.55
    min_right_ankle_ratio: 0.55
    min_full_body_ratio: 0.35
    # The downstream GVHMR/PHC/GMR contract is one human per clip.  A second
    # person at >=15% of the primary person's box scale causes a clean reject.
    max_competing_person_ratio: 0.0
    min_competing_person_scale_ratio: 0.15
    # A conservative temporal 2D posture signal for motions likely requiring
    # a chair, wall, or other external support. Keep the base default off;
    # human-only batch configs enable it after a local calibration pass.
    support_posture_mode: off       # off | report | gate
    support_posture_ratio: 0.30
    support_posture_min_run_seconds: 1.0
    support_posture_thigh_horizontal_cos: 0.75
    support_posture_shin_vertical_cos: 0.80
    support_posture_torso_vertical_cos: 0.80
    support_posture_max_hip_knee_height_ratio: 0.18
    support_posture_min_ankle_below_hip_ratio: 0.15
    support_posture_max_ankle_height_difference_ratio: 0.18
    support_posture_object_model: null
    support_posture_object_confidence: 0.05
    support_posture_object_ratio: 0.06
    support_posture_weak_pose_ratio: 0.05
  work_video:
    enabled: true
    directory: dataset_new6_work_1280
    width: 1280
    height: 960
    crf: 18
    fps: 30
    force: false

output:
  root: output_dir/dataset_new6_hand4wholepp_directmano_gmr_sharpa_aligned

# 无 GT 的批处理质量分层；输出每 clip quality_report.json 和根目录汇总。
quality_evaluation:
  enabled: true
  run_after_stages: [human, object, all]
  require_for_product: true
  pass_score: 80.0
  projection_samples: 40
  weights:
    human_only:
      files: 15
      human: 25
      hands: 35
      gmr: 15
      visualization: 10
    object:
      files: 10
      human: 15
      hands: 20
      object: 20
      contact: 20
      dynamics: 15
  thresholds:
    frame_count_warn_ratio: 0.995
    frame_count_fail_ratio: 0.98
    input_duration_warn_relative: 0.01
    input_duration_fail_relative: 0.03
    work_video_fps_warn_relative: 0.001
    work_video_fps_fail_relative: 0.01
    hand_valid_warn_ratio: 0.85
    hand_valid_fail_ratio: 0.50
    hand_reproj_p90_warn_relative: 0.35
    hand_reproj_p90_fail_relative: 0.60
    hand_spike_warn_ratio: 0.03
    hand_spike_fail_ratio: 0.10
    hand_repaired_warn_ratio: 0.35
    hand_repaired_fail_ratio: 0.60
    root_speed_p95_warn_mps: 3.0
    root_speed_p95_fail_mps: 6.0
    joint_limit_tolerance_rad: 0.001
    joint_limit_violation_warn_ratio: 0.001
    joint_limit_violation_fail_ratio: 0.01
    object_valid_warn_ratio: 0.80
    object_valid_fail_ratio: 0.35
    object_position_jump_m: 0.20
    object_rotation_jump_deg: 45.0
    object_jump_warn_ratio: 0.002
    object_jump_fail_ratio: 0.02
    projection_iou_warn: 0.30
    projection_iou_fail: 0.15
    contact_distance_m: 0.15
    contact_frame_pass_ratio: 0.10
    contact_frame_fail_ratio: 0.01
  # Advisory-only data-use tiering.  It separates direct hand observations
  # from temporal in-fills and robot IK residuals; it never deletes a clip or
  # changes product gating automatically.
  hand_data_use_advisory:
    retain_source_reliable_ratio: 0.85
    holdout_source_reliable_ratio: 0.70
    review_source_repaired_ratio: 0.20
    holdout_source_repaired_ratio: 0.35
    review_observed_reproj_p90_relative: 0.35
    holdout_observed_reproj_p90_relative: 0.60
    review_chain_error_p95_mm: 10.0

# 最终资产包与运行工作区分离。默认关闭，专用 pipeline YAML 决定何时导出/清理。
product:
  enabled: false
  root: assets/pipeline_products
  export_after_stages: []
  include_camera: true
  include_phc_motion: true
  include_preview: true
  require_preview: false
  object_policy: if_valid       # exclude | if_valid | require_valid
  minimum_quality_status: warn  # pass | warn; fail is never exported
  minimum_quality_schema_version: 3  # require the compact macro-quality report
  retention:
    # 仅当资产包 NPZ 与 SHA-256 全部校验通过后才会执行。
    prune_workspace_after_export: false
    prune_object_work_after_export: false

resume:
  skip_existing: true
  force_hand_preprocess: false
  force_locomotion: false
  force_smoothing: false
  force_phc: false
  force_gmr: true

human:
  backend: hand4wholepp       # hamer | hand4wholepp | wilor
  constraint_profile: conservative
  gvhmr_batch_size: 4
  hand_batch_size: 1
  vitpose_image_scale: 1.0
  low_memory: true
  isolate_hand_process: true
  # Experimental: fills only short detector gaps. Keep off for baseline runs;
  # high-quality DWPose observations always remain direct measurements.
  hand_crop_tracking:
    mode: "off"               # off | flow_kalman
    max_gap: 8
    max_prediction_gap: 2
    direct_observation_quality: 0.75
  # Final-render-space 2D wrist correction for clearly visible H4W++ hands.
  # It remains opt-in: 2D evidence cannot establish palm/back semantics.
  visible_hand_refine:
    enabled: false
    device: auto               # auto | cuda | cpu
    batch_size: 16
    steps: 8
    lr: 0.02
    prior_weight: 0.02
    fit_confidence: 0.60
    fit_min_keypoints: 12
    # all preserves legacy behavior. human_sharpa uses non_tip after its
    # seven-clip fingertip-holdout audit passed.
    fit_partition: all        # all | non_tip
    holdout_min_keypoints: 3
    holdout_max_relative_regression_px: 1.0
    max_delta_degrees: 25.0
    min_relative_improvement: 0.25
    min_relative_improvement_px: 2.0
    max_absolute_regression_px: 2.0
    max_anchor_error_px: 20.0
    max_anchor_error_bbox_ratio: 0.25
    evidence_hand_confidence: 0.45
    evidence_min_keypoints: 8
    evidence_mean_confidence: 0.50
    evidence_wrist_confidence: 0.45
    evidence_min_bbox_diagonal_px: 96.0
    evidence_min_run: 3
  filters:
    wrist: false
    temporal: true
    fingers: true
    # Legacy baseline is interpolation then smoothing.  These switches make
    # wrist orientation A/B-able without disabling local-finger filtering.
    global_orient_fill_mode: interpolate   # interpolate | preserve
    wrist_mode: smooth                     # smooth | preserve
  diagnostics: true

locomotion:
  enabled: true
  smooth_window: 9

phc:
  enabled: true

gmr:
  enabled: true
  hand_model: sharpa          # sharpa=G1 body + external Sharpa | g1 | brainco
  source: final                 # PHC-grounded when successful, otherwise 001_smoothed
  target_fps: 30
  # One global foot-geometry calibration preserves the source vertical
  # trajectory. Eventwise root-Z correction is experimental and requires an
  # independently validated support signal; G1 sole geometry alone is not one.
  height_adjust_mode: global_foot_geom
  support_contact_height: 0.08       # m, sole-height candidate threshold
  support_exit_contact_height: 0.10  # m, exit hysteresis; must be >= entry
  support_max_vertical_speed: 1.20   # m/s, rejects a fast airborne foot
  support_max_horizontal_speed: 0.15 # m/s, rejects a sliding/swinging foot
  support_min_contact_run: 3         # frames
  support_max_contact_gap: 1         # frames
  support_root_step_limit: 0.03      # m/frame; 0 disables transition limiting
  support_apply_root_z: false        # explicit experimental opt-in only
  human_yaw_offset_deg: 0.0
  camera_source: gvhmr
  render: true
  composite_2x2: true
  mujoco_gl: egl
  render_width: 960
  render_height: 720

object:
  enabled: false
  # The implementation and project-local weights are intentionally archived.
  # Restore only via archive/object_reconstruction_20260720/README.md.
  archive_readme: archive/object_reconstruction_20260720/README.md

  # RGB-only 推荐 monocular；有对齐深度时可用 foundationpose。
  mode: monocular             # monocular | foundationpose
  only_configured_clips: true
  rerender_gmr_after_import: true

  collision:
    method: auto              # auto | coacd | convex-hull
    density_kg_m3: 600.0
    mass_kg: null

  overlay:
    enabled: true
    alpha: 0.82

  monocular:
    run_reconstruction: true
    work_root: object_work/do_as_i_do
    reconstruction_script: do-as-i-do-main/reconstruction/run_pipeline.sh
    # SAM-HQ + Cutie 负责 mask；参考网格固定走 Hunyuan3D。
    segmentation_prompt_mode: auto   # auto | click
    segmentation_prompt: ""
    samhq_checkpoint: null       # 可填本地 sam_hq_vit_l.pth；null 时自动解析
    cutie_checkpoint: null       # 可填本地 cutie-base-mega.pth；null 时自动解析
    require_segmentation_checkpoint: true
    person_roi:
      enabled: true
      bbox_scale: 2.0
      min_mask_inside_ratio: 0.60
    auto_detector:
      model: models/yolo11n.pt
      confidence: 0.05
      min_box_inside_person_roi: 0.50
      box_padding_ratio: 0.08
    hunyuan_face_count: 100000
    hunyuan_timeout: 900
    hunyuan_region: ap-guangzhou
    moge_resolution_level: 7
    megapose:
      pose_hypotheses: 5
      coarse_grid_stride: 2
      refiner_iterations: 5
      temporal_refiner_iterations: 2
      reinit_interval: 120
      min_iou: 0.05
      reinit_iou: 0.18
      max_interpolation_gap: 8
    default_object_name: object
    default_reference_frame: 0

  quality:
    min_valid_ratio: 0.35
    min_observed_ratio: 0.10

  foundationpose:
    # 可使用 {clip} 占位符，例如 foundationpose-plus-plus-main/test_data/{clip}
    result_dir_template: foundationpose-plus-plus-main/test_data/{clip}

  # 每个片段的物体名称、参考帧和动态释放帧通常不同。
  clips:
    Date02_Sub02_chairwood_hand.0.color:
      object_name: chair
      reference_frame: 60
      expected_size_m: [0.45, 1.60]
      dynamic_release_frame: 0

  dynamic_validation:
    enabled: false
    required: false
    substeps: 16
    lift_threshold_m: 0.05
    object_floor_collision: true
    render_video: true

# Static human-scene reconstruction is intentionally independent from the
# dynamic object stage.  The first deployment only exposes the contract and
# preflight; CRISP execution is enabled by the dedicated human_scene pipeline.
scene:
  enabled: false
  required: false
  backend: crisp
  source_motion: smoothed
  physics_motion: final
  output_subdir: scene_reconstruction
  work_root: scene_work/crisp

  camera:
    mode: fixed
    source: gvhmr
    validate_static: true
    freeze_method: robust_median
    retain_raw_trajectory: true

  external_human:
    model_type: smpl
    include_vertices: true
    include_joints: true
    include_faces: true
    units: meter

  crisp:
    root: external/CRISP-Real2Sim
    conda_env: crisp
    run_mask: true
    run_mogesam: true
    run_ufm: true
    run_contact_pass: false
    run_nksr: false
    static_camera: true
    hmr_type: external

  collision:
    export_obj: true
    export_urdf: true
    export_mujoco: true
    prefer_box_primitives: true
    allow_mesh_fallback: true

  quality:
    enabled: true
    required_for_product: false
    max_primitives_warn: 80
    max_primitives_fail: 150
    contact_distance_warn_m: 0.05
    penetration_p95_fail_m: 0.03

  runtime:
    gpu: 0
    max_parallel_clips: 1
    timeout_seconds: 3600

runtime:
  conda_base: ${HOME}/miniconda3
  python: ${HOME}/miniconda3/envs/locomotion/bin/python
  cuda_visible_devices: "0"
  # 物体点选的 OpenCV 窗口；当前桌面会话通常是 :0。
  segmentation_display: ":0"
  conda_envs:
    samhq: moge2
    moge2: moge2
    megapose: megapose
    crisp: crisp

# 高级参数可直接覆盖现有 Bash 环境变量。不要在此保存任何云密钥。
environment:
  GVHMR_HAND4WHOLEPP_JOINT_SOURCE: direct_mano
  # Keep the current result as the baseline. Set to 1 for the direct-MANO
  # pose/joints consistency A/B candidate.
  GVHMR_RECOMPUTE_DIRECT_MANO: 0
  GVHMR_RECOMPUTE_DIRECT_MANO_BATCH_SIZE: 256
  GMR_HAND_INVALID_MODE: interp
