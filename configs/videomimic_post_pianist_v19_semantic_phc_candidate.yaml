# Isolated PHC-only candidate.  It consumes the hash-attested, seat-only
# semantic proxy; raw NKSR collision meshes are intentionally unavailable.
input:
  dataset_dir: /home/jixingyu/data/animation
  clip_filter: Ways_to_Jump_+_Sit_+_Fall_Pianist_clip1
  min_duration_seconds: 0
  max_videos: 1

output:
  root: output_dir/videomimic_post_pianist_v19_semantic_phc_candidate

runtime:
  cuda_visible_devices: "4"

phc:
  enabled: true

gmr:
  enabled: false
  source: final

scene:
  enabled: true
  required: true
  backend: videomimic_nksr
  source_motion: smoothed
  output_subdir: scene_reconstruction_v18a_auto_semantic_chair
  camera:
    mode: fixed
    source: gvhmr
    validate_static: true
    freeze_method: robust_median
    retain_raw_trajectory: true
    canonicalization: static_optimized
  # Present only so the shared preflight can validate the installed backend;
  # this PHC-only candidate never invokes a new VideoMimic reconstruction.
  videomimic:
    root: external/VideoMimic/real2sim
    recon_env: vm1recon
    human_env: vm1rs
    gender: auto
    human_mask_mode: sam2
    max_frames: 0
    frame_stride: 1
    meshification_method: nksr
    stage4:
      enabled: false
  robot_bridge:
    enabled: true
    source_output_root: output_dir/videomimic_source_pianist_v19_semantic_phc
    source_scene_subdir: scene_reconstruction_v18a_auto_semantic_chair
    motion_name: human_motion_static_hard.npz
    camera_name: gvhmr_camera_static_hard.npz
  isaac:
    enabled: true
    collision_mode: semantic_seat_support_only
    semantic_preflight_report: scene_work/semantic_auto_layout_pianist_v18a/physics_preflight_v1/semantic_phc_preflight_v1.json
    allow_global_floor_fix: false
  physics:
    enabled: false
  runtime:
    gpu: 4
    max_parallel_clips: 1
    timeout_seconds: 21600

resume:
  skip_existing: false
  force_phc: true
  force_gmr: false
