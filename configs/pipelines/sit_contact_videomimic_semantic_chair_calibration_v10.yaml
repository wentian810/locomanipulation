# Controlled physics-only experiment following the PHC/scene alignment audit.
# The source scene/human package stays untouched.  Only the newly created PHC
# bridge input is adjusted, then evaluated against the *original* canonical
# motion with audit_phc_scene_alignment.py.

input:
  dataset_dir: /home/jixingyu/data/animation
  clip_filter: Ways_to_Jump_+_Sit_+_Fall_Dramatic_clip1
  min_duration_seconds: 0

output:
  root: output_dir/sit_contact_scene_static_hard_semantic_calibration_v10

resume:
  skip_existing: true
  force_phc: true
  force_gmr: false

gmr:
  enabled: false

scene:
  enabled: true
  required: true
  backend: videomimic_nksr
  source_motion: smoothed
  physics_motion: final
  output_subdir: scene_reconstruction_semantic_chair_v2
  work_root: scene_work/sit_contact_pipeline_v1
  camera:
    mode: fixed
    source: gvhmr
    validate_static: true
    canonicalization: static_hard
  videomimic:
    root: external/VideoMimic/real2sim
    recon_env: vm1recon
    human_env: vm1rs
    gender: auto
    max_frames: 0
    meshification_method: nksr
  robot_bridge:
    enabled: true
    source_output_root: output_dir/sit_contact_scene_static_hard_isaac_v4
    motion_name: human_motion_static_hard.npz
    camera_name: gvhmr_camera_static_hard.npz
  isaac:
    enabled: true
    collision_mode: semantic_primitives_only
  # v6 audit: PHC state median sit residual was (+0.011, +0.121, -0.267) m
  # in Z-up.  Apply the opposite, rounded correction to its reference only.
  # This is an experiment, never a replacement for the published canonical
  # scene/human alignment unless its post-run audit passes.
  phc_reference_calibration:
    enabled: true
    offset_z_up_m: [0.0, -0.12, 0.27]
    ramp_start_frame: 75
    full_strength_frame: 98
  runtime:
    gpu: 2
    max_parallel_clips: 1
    timeout_seconds: 3600

quality_evaluation:
  enabled: false
  run_after_stages: []

product:
  enabled: false
  export_after_stages: []
