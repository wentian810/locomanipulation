# 原始人体-only 流程：GVHMR -> Locomotion -> PHC -> GMR/Sharpa -> 2x2。
# 本配置保留工作区，适合检查；批处理清理版见 human_sharpa_batch.yaml。

input:
  dataset_dir: dataset_new6
  clip_filter: ""

output:
  root: output_dir/dataset_new6_hand4wholepp_directmano_gmr_sharpa_aligned

environment:
  # Final pose/joints consistency repair for the Hand4Whole++ backend.  It is
  # intentionally scoped to this pipeline rather than configs/default.yaml,
  # because other hand backends do not expose the same direct-MANO contract.
  GVHMR_RECOMPUTE_DIRECT_MANO: 1

human:
  backend: hand4wholepp
  constraint_profile: conservative
  hand_batch_size: 1
  # Crop tracking is now the pipeline default: direct high-quality DWPose
  # observations remain untouched, while short misses use flow/Kalman support.
  hand_crop_tracking:
    mode: flow_kalman
    max_gap: 8
    max_prediction_gap: 2
    direct_observation_quality: 0.75
  # Enabled after seven clips also passed a non-tip-fit, fingertip-holdout A/B.
  # Each accepted frame must not increase its confidence-weighted held-out
  # fingertip relative error. This is still not a palm/back semantic verdict.
  visible_hand_refine:
    enabled: true
    fit_partition: non_tip
    holdout_min_keypoints: 3
    holdout_max_relative_regression_px: 0.0

phc:
  enabled: true

gmr:
  enabled: true
  hand_model: sharpa
  # The pipeline publishes this zero-copy selection after PHC: PHC-grounded
  # on success and 001_smoothed on a current-run PHC failure.
  source: final
  render: true
  composite_2x2: true

object:
  enabled: false

product:
  enabled: true
  root: assets/dataset_new6_human_sharpa
  export_after_stages: [human, all]
  include_camera: true
  include_preview: true
  require_preview: true
  object_policy: exclude
  retention:
    prune_workspace_after_export: false
    prune_object_work_after_export: false
