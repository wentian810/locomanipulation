# End-to-end acceptance replay with a gravity-level semantic chair and the
# reference-anchored PHC exporter.  The scene is unchanged from V12; this run
# validates only the corrected PHC -> GMR/MuJoCo motion handoff.

input:
  dataset_dir: /home/jixingyu/data/animation
  clip_filter: Ways_to_Jump_+_Sit_+_Fall_Dramatic_clip1
  min_duration_seconds: 0

output:
  root: output_dir/sit_contact_scene_static_hard_semantic_level_v13

resume:
  skip_existing: true
  force_phc: true
  force_gmr: true

gmr:
  enabled: true
  source: auto
  camera_source: gvhmr
  scene_mujoco_name: scene_reconstruction_semantic_chair_v3/scene/scene_mujoco_semantic_chair.xml
  render: true
  composite_2x2: true
  mujoco_gl: egl

scene:
  enabled: true
  required: true
  backend: videomimic_nksr
  source_motion: smoothed
  physics_motion: final
  output_subdir: scene_reconstruction_semantic_chair_v3
  work_root: scene_work/sit_contact_pipeline_v1
  camera:
    mode: fixed
    source: gvhmr
    validate_static: true
    canonicalization: static_hard
  videomimic:
    root: external/VideoMimic/real2sim
    recon_env: vm1recon
    human_env: vm1rs
    gender: auto
    max_frames: 0
    meshification_method: nksr
  robot_bridge:
    enabled: true
    source_output_root: output_dir/sit_contact_scene_static_hard_semantic_assets_v11
    motion_name: human_motion_static_hard.npz
    camera_name: gvhmr_camera_static_hard.npz
  isaac:
    enabled: true
    collision_mode: semantic_primitives_only
    allow_global_floor_fix: false
  runtime:
    gpu: 4
    max_parallel_clips: 1
    timeout_seconds: 3600

quality_evaluation:
  enabled: false
  run_after_stages: []

product:
  enabled: false
  export_after_stages: []
