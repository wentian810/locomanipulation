# 人体-only 工程化批处理：资产校验成功后删除每个 clip 的运行工作区。
# output.root 是可删除的 scratch；永久结果只在 product.root。

input:
  dataset_dir: dataset_new6
  clip_filter: ""

output:
  root: scratch/dataset_new6_human_sharpa

human:
  backend: hand4wholepp
  constraint_profile: conservative
  hand_batch_size: 1
  diagnostics: false
  # Keep batch outputs on the same Hand4Whole++ quality path as the
  # inspection preset: bridge short crop-detector gaps, then accept 2D
  # refinements only when held-out fingertip evidence does not regress.
  hand_crop_tracking:
    mode: flow_kalman
    max_gap: 8
    max_prediction_gap: 2
    direct_observation_quality: 0.75
  visible_hand_refine:
    enabled: true
    fit_partition: non_tip
    holdout_min_keypoints: 3
    holdout_max_relative_regression_px: 0.0

environment:
  # Hand4Whole++ filters alter MANO pose. Recompute its joints from that final
  # pose so the GVHMR render and external Sharpa sidecar use one hand contract.
  GVHMR_RECOMPUTE_DIRECT_MANO: 1

phc:
  enabled: true

gmr:
  enabled: true
  hand_model: sharpa
  source: final
  render: true
  composite_2x2: true

object:
  enabled: false

product:
  enabled: true
  root: assets/dataset_new6_human_sharpa
  export_after_stages: [human, all]
  include_camera: true
  include_preview: true
  require_preview: true
  object_policy: exclude
  retention:
    prune_workspace_after_export: true
    prune_object_work_after_export: false
